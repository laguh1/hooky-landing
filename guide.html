      content: counter(step); flex-shrink: 0; width: 26px; height: 26px; border-radius: 8px;
      background: var(--purple); color: #fff; font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; margin-top: 1px;

      margin-top: 18px; background: var(--gray-50); border-left: 3px solid var(--purple);

/* ─── Render ─────────────────────────────────────────────── */
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function render(l) {
  const t = T[l];
  const imgLang = l === 'pt' ? 'pt' : 'en';
  document.getElementById('toc').innerHTML = SECTIONS.map(s =>
    `<a href="#${s.id}">${esc(t.s[s.id].t)}</a>`).join('');
  document.getElementById('sections').innerHTML = SECTIONS.map(s => {
    const c = t.s[s.id];
    const icon = s.icon.endsWith('.svg') ? `<img src="${s.icon}" alt="">` : `<span>${s.icon}</span>`;
    const tip = s.pro ? (EARLY ? c.tip_early : c.tip_trial) : c.tip;
    const ids = (s.shorts && s.shorts[l]) || [];
    const videos = ids.length ? `<div class="g-videos">${ids.map(id =>
      `<div class="g-video"><iframe src="https://www.youtube.com/embed/${id}" title="${esc(c.t)}" loading="lazy" allowfullscreen></iframe></div>`).join('')}</div>` : '';
    const shot = s.img ? `<img class="g-shot" src="assets/${s.img}-${imgLang}.jpg" alt="${esc(c.t)}" loading="lazy">` : '';
    return `<section class="g-section${s.img ? '' : ' no-img'}" id="${s.id}">
      <div class="g-grid">
        <div>
          <div class="g-title"><div class="g-icon">${icon}</div><h2>${esc(c.t)}${s.pro ? '<span class="g-pro-tag">PRO</span>' : ''}</h2></div>
          <p class="g-intro">${esc(c.i)}</p>
          <ol class="g-steps">${c.st.map(x => `<li>${esc(x)}</li>`).join('')}</ol>
          <p class="g-tip"><strong>${esc(t.tip)}</strong> ${esc(tip)}</p>
          ${videos}
        </div>
        ${shot}
      </div>
    </section>`;
  }).join('');
}

function setLang(l) {
  localStorage.setItem('hooky_lang', l);
  document.documentElement.lang = l === 'pt' ? 'pt-BR' : l;
  const t = T[l];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t[el.getAttribute('data-i18n')];
    if (v !== undefined) el.textContent = v;
  });
  document.title = t.doc_title;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent === l.toUpperCase()));
  render(l);
  if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
}

function detectLang() {
  const s = localStorage.getItem('hooky_lang');
  if (s && T[s]) return s;
  const n = (navigator.language || 'en').toLowerCase();
  if (n.startsWith('pt')) return 'pt';
  if (n.startsWith('es')) return 'es';
  return 'en';
}

setLang(detectLang());
